<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Närvaro Falun</title>
<style>
:root{--bg:#eef2f8;--sf:#fff;--ink:#14213d;--mut:#5b6879;--ln:#d9e0ec;--ac:#274b8f;--acf:#fff;--rd:#b3283f;--gr:#1f7a4d;--gold:#e0a82e;--sh:0 1px 3px rgba(20,33,61,.08),0 4px 14px rgba(20,33,61,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1421;--sf:#172033;--ink:#e8edf6;--mut:#9aa7bb;--ln:#2a3550;--ac:#8fb4f5;--acf:#0b1220;--rd:#f0889c;--gr:#6fd39e;--gold:#e8b94a;--sh:none}}
:root[data-theme="dark"]{--bg:#0e1421;--sf:#172033;--ink:#e8edf6;--mut:#9aa7bb;--ln:#2a3550;--ac:#8fb4f5;--acf:#0b1220;--rd:#f0889c;--gr:#6fd39e;--gold:#e8b94a;--sh:none}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.nm{font:700 21px/1.15 Georgia,serif}.who{font-size:13px;color:var(--mut)}
.w{max-width:680px;margin:0 auto;padding:14px 14px calc(110px + env(safe-area-inset-bottom,0px))}
h3{margin:0 0 4px;font-size:17px}
.pan{background:var(--sf);border-radius:16px;padding:16px;margin:12px 0;box-shadow:var(--sh);border:1px solid var(--ln)}
.sub{color:var(--mut);font-size:14px}.ti{color:var(--mut);font-size:.92em;font-weight:400}
.err{color:var(--rd);font-size:14px;margin-top:8px}
.note{background:var(--sf);border:1px dashed var(--gold);border-radius:12px;padding:10px 12px;font-size:14px;margin:12px 0 0}
.emp{text-align:center;color:var(--mut);padding:26px 12px}.emp b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
input[type=text],input[type=tel],input[type=date],input[type=password],select{width:100%;font:inherit;padding:12px 13px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.add{display:flex;gap:8px;margin-top:10px}
.btn{border:0;background:var(--ac);color:var(--acf);font:inherit;font-weight:600;padding:12px 18px;border-radius:12px;cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--ln)}.btn.sm{padding:8px 13px;font-size:14px}.btn:disabled{opacity:.35}
.chip{border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:8px 14px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}.li:last-child{border:0}
.li>span{flex:1}.li input[type=text]{flex:1}.li select{width:auto;max-width:44%}
.x{border:0;background:none;color:var(--mut);font-size:24px;line-height:1;cursor:pointer;padding:2px 8px}
.stp{display:flex;gap:8px;align-items:center}.stp select{flex:1;font-weight:600;text-transform:capitalize}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.tl{background:var(--bg);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;color:var(--mut);border:2px solid transparent}
.tl b{display:block;font-size:22px;color:var(--ink)}
.tl.go{border-color:var(--gr)}.tl.no{border-color:var(--rd)}.tl.am{border-color:var(--gold)}
.mkr{display:flex;gap:6px;flex:none}
.sg{width:46px;height:46px;border-radius:12px;border:2px solid var(--ln);background:var(--bg);color:var(--mut);font:800 19px system-ui,sans-serif;cursor:pointer}
.sg.go{background:var(--gr);border-color:var(--gr);color:#fff}.sg.no{background:var(--rd);border-color:var(--rd);color:#fff}.sg.am{background:var(--gold);border-color:var(--gold);color:#241a00}.sg.soft{opacity:.7;border-style:dashed}
.nmz{flex:1;min-width:0}.nmz b{display:block;overflow:hidden;text-overflow:ellipsis}
.tg{color:var(--rd);font-size:12px;font-weight:700}
.day{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:var(--sh)}
.day h4{margin:0 0 4px;font-size:16px;text-transform:capitalize}
.ab{border:2px solid var(--gr);background:transparent;color:var(--gr);border-radius:12px;font:600 14px/1.2 system-ui,sans-serif;padding:8px 12px;cursor:pointer;min-width:132px}
.ab.on{background:var(--rd);border-color:var(--rd);color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;background:none;padding:8px 2px 9px;font:600 11px system-ui,sans-serif;color:var(--mut);cursor:pointer}
.nav button span{display:block;font-size:20px;line-height:1.3}.nav button.on{color:var(--ac)}
.hero{text-align:center;padding:22px 8px 6px}.hero .big{font:700 30px/1.15 Georgia,serif}
.pill{display:inline-block;background:var(--bg);border:1px solid var(--ln);border-radius:99px;padding:3px 11px;font-size:13px;margin:3px 4px 0 0}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== INSTÄLLNINGAR ===== */
var FB={apiKey:'AIzaSyBsd0LHeU2CKCqw1RGaXLuxk1HbU6hZPx8',authDomain:'falun-mezmuer-hxanat.firebaseapp.com',projectId:'falun-mezmuer-hxanat',storageBucket:'falun-mezmuer-hxanat.firebasestorage.app',messagingSenderId:'404269157555',appId:'1:404269157555:web:e1d251703e8cdcdf20b4c6'};
var ADMINS=['0736512835'];                         // superadmin (kan inte tas bort)
var ADMIN_NAMES={'0736512835':'Selina Gebrehiwet'};
var ADMIN_PW='kidusmikael12';                      // kan ändras i appen under Inställningar
/* ========================= */

var WD=['söndag','måndag','tisdag','onsdag','torsdag','fredag','lördag'],MON=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'],TW=['ሰንበት','ሰኑይ','ሰሉስ','ረቡዕ','ሓሙስ','ዓርቢ','ቀዳም'];
var RS=[['sjuk','Sjuk','ሕሙም'],['bortrest','Bortrest','ጉዕዞ'],['familj','Familjeskäl','ምኽንያት ቤተሰብ'],['fotboll','Fotbollsträning','ልምምድ ኩዕሶ እግሪ'],['annat','Annat','ካልእ']];
function clone(o){return JSON.parse(JSON.stringify(o))}
var DEFCFG={name:'Närvaro Falun',days:[6,0],start:'',end:'',wa:'',pw:'',groups:[],admins:[]};
var S={cfg:clone(DEFCFG),fam:{},abs:{}};
var ME=localStorage.getItem('hm_me')||'',VIEW='a',TAB='n',GSEL='',DSEL='',PD='',FQ='',RSEL='',ANOTE=null,REG=[''],RPH='',RNM='',LT='t',CLOUD=false,fs=null,LOADED=false;
var REGMODE=/[?&]registrera/.test(location.search),REGG=(location.search.match(/registrera=([^&]+)/)||[])[1]||'';
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function B(sv,ti,blk){return esc(sv)+(blk?'<br>':' ')+'<span class="ti">'+ti+'</span>'}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function norm(p){p=String(p||'').replace(/\D/g,'');if(p.indexOf('0046')===0)p='0'+p.slice(4);else if(p.indexOf('46')===0&&p.length>9)p='0'+p.slice(2);return p}
function wnum(p){p=norm(p);return p.charAt(0)==='0'?'46'+p.slice(1):p}
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function dlabel(s){var d=new Date(s+'T12:00:00');return WD[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]}
function tw(s){return TW[new Date(s+'T12:00:00').getDay()]}
function setMe(p){ME=p;try{if(p)localStorage.setItem('hm_me',p);else localStorage.removeItem('hm_me')}catch(e){}}
function rl(id){return RS.filter(function(x){return x[0]===id})[0]||[id,id,'']}

/* ---------- Lagring (Firebase eller lokalt testläge) ---------- */
try{if(window.firebase&&FB.apiKey&&FB.projectId){firebase.initializeApp(FB);fs=firebase.firestore();CLOUD=true}}catch(e){}
if(CLOUD){
  fs.collection('hm_cfg').doc('main').onSnapshot(function(d){if(d.exists)S.cfg=Object.assign(clone(DEFCFG),d.data());draw(true)});
  fs.collection('hm_ppl').onSnapshot(function(s){S.fam={};s.forEach(function(d){S.fam[d.id]=d.data()});LOADED=true;draw(true)});
  fs.collection('hm_abs').onSnapshot(function(s){S.abs={};s.forEach(function(d){S.abs[d.id]=d.data()});draw(true)});
}else{LOADED=true;try{var x=JSON.parse(localStorage.getItem('hm_v2'));if(x)S=x}catch(e){}}
function lsave(){if(!CLOUD)try{localStorage.setItem('hm_v2',JSON.stringify(S))}catch(e){}}
function wcfg(){if(CLOUD)fs.collection('hm_cfg').doc('main').set(S.cfg);lsave();draw()}
function wfam(id){if(CLOUD)fs.collection('hm_ppl').doc(id).set(S.fam[id]);lsave();draw()}
function dfam(id){delete S.fam[id];if(CLOUD)fs.collection('hm_ppl').doc(id).delete();lsave();draw()}
function wabs(id,o){S.abs[id]=o;if(CLOUD)fs.collection('hm_abs').doc(id).set(o);lsave();draw()}
function dabs(id){delete S.abs[id];if(CLOUD)fs.collection('hm_abs').doc(id).delete();lsave();draw()}

/* ---------- Data-hjälpare ---------- */
function gget(id){return S.cfg.groups.filter(function(g){return g.id===id})[0]||null}
function gref(id){return gget(id)||S.cfg}
function gs(id){return gref(id)}
function gk(k){return gget(k.g)?k.g:''}
function gnm(id){var g=gget(id);return g?g.n:'Utan grupp'}
function pOf(ph){var k=Object.keys(S.fam);for(var i=0;i<k.length;i++)if((S.fam[k[i]].ph||[]).indexOf(ph)>-1)return S.fam[k[i]];return null}
function ownerOf(ph,ex){var k=Object.keys(S.fam);for(var i=0;i<k.length;i++)if(k[i]!==ex&&(S.fam[k[i]].ph||[]).indexOf(ph)>-1)return S.fam[k[i]];return null}
function aent(p){return S.cfg.admins.filter(function(a){return a.p===p})[0]}
function isAdminU(p){return p==='#admin'||ADMINS.indexOf(p)>-1||!!aent(p)}
function full(){var a=aent(ME);return ME==='#admin'||ADMINS.indexOf(ME)>-1||(!!a&&!a.g.length)}
function aname(p){if(p==='#admin')return'Admin';var a=aent(p);return ADMIN_NAMES[p]||(a&&a.n)||''}
function allKids(){var r=[];Object.keys(S.fam).forEach(function(i){var p=S.fam[i];(p.kids||[]).forEach(function(k){r.push({k:k,p:p})})});return r.sort(function(a,b){return a.k.n.localeCompare(b.k.n,'sv')})}
function kidsOf(g){return allKids().filter(function(o){return gk(o.k)===g})}
function vgroups(){var a=aent(ME),f=full(),l=S.cfg.groups.filter(function(g){return f||(a&&a.g.indexOf(g.id)>-1)}).map(function(g){return{id:g.id,n:g.n}});
  if(f&&(!S.cfg.groups.length||allKids().some(function(o){return!gget(o.k.g)})))l.push({id:'',n:'Utan grupp'});return l}
function mdays(gid,back){
  var s=gs(gid),t=new Date();t.setHours(12,0,0,0);t.setDate(t.getDate()-(back||0));
  var e=s.end?new Date(s.end+'T12:00:00'):new Date(t.getTime()+400*864e5),d0=new Date(t),r=[];
  if(s.start){var st=new Date(s.start+'T12:00:00');if(st>d0)d0=st}
  for(var d=new Date(d0),n=0;d<=e&&n<700;d.setDate(d.getDate()+1),n++)if(s.days.indexOf(d.getDay())>-1)r.push(iso(d));
  return r;
}
function rep(d,k){return S.abs['r_'+d+'_'+k]}
function mark(d,k){var m=S.abs['m_'+d+'_'+k];return m?m.st:''}
function ask(msg,ok){var d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99';
  d.innerHTML='<div class="pan" style="max-width:380px;width:100%;margin:0"><p style="margin:0 0 14px;font-size:17px">'+esc(msg)+'</p><div class="add" style="margin:0"><button class="btn" id="ay" style="background:#b3283f;color:#fff">Ta bort / ሰርዝ</button><button class="btn g" id="an">Avbryt / ኣቋርጽ</button></div></div>';
  document.body.appendChild(d);d.querySelector('#ay').onclick=function(){d.remove();ok()};d.querySelector('#an').onclick=function(){d.remove()}}
function dchips(o,g,fn){return[1,2,3,4,5,6,0].map(function(d){return'<button class="chip'+(o.days.indexOf(d)>-1?' on':'')+'" data-g="'+g+'" data-d="'+d+'" onclick="'+fn+'(this)">'+WD[d].slice(0,3)+'</button>'}).join('')}

/* ---------- Ritning ---------- */
function draw(soft){
  if(soft&&document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  var ad=ME&&isAdminU(ME),me=ME&&pOf(ME),mode=!ME?'s':(ad&&(VIEW!=='p'||!me))?'a':me?'p':'w';
  if(mode==='w'&&LOADED){setMe('');mode='s'}
  var wl=mode==='a'?(ME==='#admin'?'Admin':(aname(ME)||ME)+(ADMINS.indexOf(ME)>-1?' · högsta admin':' · admin')):(me?(me.n||ME):'');
  var h='<header class="top"><div><div class="nm">'+esc(S.cfg.name)+'</div>'+(ME&&wl?'<div class="who">'+esc(wl)+'</div>':'')+'</div><div style="display:flex;gap:6px">'+
   (ad&&me?'<button class="btn g sm" onclick="VIEW=VIEW===\'p\'?\'a\':\'p\';draw()">'+(mode==='a'?'Föräldravy':'Adminvy')+'</button>':'')+
   (ME?'<button class="btn g sm" onclick="logout()">'+(mode==='a'?'Logga ut':B('Logga ut','ወጻእ'))+'</button>':'')+'</div></header><main class="w">';
  if(!CLOUD)h+='<div class="note">Testläge: allt sparas bara på den här enheten. Firebase är inte kopplat.</div>';
  h+=mode==='s'?start():mode==='a'?admin():mode==='p'?parent():'<div class="emp">'+B('Laddar…','ይጽዓን ኣሎ…')+'</div>';
  h+='</main>';
  if(mode==='a'){
    var T=[['n','✓','Närvaro'],['p','👤','Personer'],['r','✉','Anmälan']];if(full())T=T.concat([['g','☰','Grupper'],['a','★','Admins'],['s','⚙','Inställn.']]);
    h+='<nav class="nav">'+T.map(function(t){return'<button class="'+(TAB===t[0]?'on':'')+'" data-t="'+t[0]+'" onclick="TAB=this.dataset.t;draw();window.scrollTo(0,0)"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('')+'</nav>';
  }
  $('app').innerHTML=h;
}

/* ---------- Inloggning och registrering ---------- */
function start(){
  if(REGMODE)return regPage();
  var t=LT==='t';
  return'<div class="hero"><div class="big">'+esc(S.cfg.name)+'</div><div class="sub">'+B('Välkommen','እንቋዕ ብደሓን መጻእኩም')+'</div></div>'+
  '<div class="row" style="justify-content:center"><button class="chip'+(t?' on':'')+'" onclick="LT=\'t\';draw()">'+B('Telefon','ተሌፎን')+'</button><button class="chip'+(t?'':' on')+'" onclick="LT=\'a\';draw()">Admin</button></div><div class="pan">'+
  (t?'<h3>'+B('Logga in med telefonnummer','ብቁጽሪ ተሌፎን እቶ')+'</h3><div class="add"><input type="tel" id="lp" placeholder="Telefonnummer / ቁጽሪ ተሌፎን" autocomplete="tel" onkeydown="if(event.key===\'Enter\')login()"><button class="btn" onclick="login()">'+B('Logga in','እቶ')+'</button></div>'
   :'<h3>Admin</h3><div class="add"><input type="password" id="lp" placeholder="Lösenord eller telefonnummer" onkeydown="if(event.key===\'Enter\')loginPw()"><button class="btn" onclick="loginPw()">Logga in</button></div>')+'<div class="err" id="le"></div></div>';
}
function login(){var p=norm($('lp').value);if(isAdminU(p)||pOf(p)){setMe(p);VIEW='a';draw()}else $('le').textContent='Numret finns inte. Be ledaren om registreringslänken. / እቲ ቁጽሪ የለን። ሊንክ ምዝገባ ካብ መራሒ ሕተት።'}
function loginPw(){var v=$('lp').value.trim(),pw=S.cfg.pw||ADMIN_PW;
  if(v===pw){setMe('#admin');VIEW='a';draw();return}
  var n=norm(v);if(n&&isAdminU(n)){setMe(n);VIEW='a';draw();return}
  $('le').textContent='Fel lösenord eller nummer.'}
function logout(){setMe('');draw()}
function regPage(){
  var g=gget(REGG);
  return'<div class="hero"><div class="big">'+esc(S.cfg.name)+'</div>'+(g?'<span class="pill">'+esc(g.n)+'</span>':'')+'</div><div class="pan"><h3>'+B('Registrera dig som förälder','ከም ወላዲ ተመዝገብ')+'</h3><div class="sub">'+B('Skriv ditt namn och barnets namn. Tryck på plus om du har fler barn. Skriv sedan ditt telefonnummer.','ስምካን ሽም ቆልዓን ጽሓፍ። ልዕሊ ሓደ ቆልዓ እንተልዩካ + ጠውቕ። ድሕሪኡ ቁጽሪ ተሌፎንካ ጽሓፍ።',1)+'</div>'+
  '<input type="text" value="'+esc(RNM)+'" placeholder="Ditt namn / ስምካ" oninput="RNM=this.value" style="margin-top:10px">'+
  REG.map(function(n,i){return'<input type="text" value="'+esc(n)+'" placeholder="Barnets namn / ሽም ቆልዓ" oninput="REG['+i+']=this.value" style="margin-top:10px">'}).join('')+
  '<div class="row"><button class="chip" onclick="REG.push(\'\');draw()">+ '+B('Fler barn','ካልእ ቆልዓ')+'</button></div><input type="tel" value="'+esc(RPH)+'" placeholder="Ditt telefonnummer / ቁጽሪ ተሌፎንካ" oninput="RPH=this.value"><div class="add"><button class="btn" style="flex:1" onclick="register()">'+B('Registrera','ተመዝገብ')+'</button></div><div class="err" id="re"></div></div>';
}
function register(){
  var ph=norm(RPH),k=REG.map(function(s){return s.trim()}).filter(Boolean),e=$('re'),g=gget(REGG)?REGG:'';
  if(!k.length){e.textContent='Skriv minst ett barns namn. / እንተወሓደ ሽም ሓደ ቆልዓ ጽሓፍ።';return}
  if(ph.length<6){e.textContent='Skriv ditt telefonnummer. / ቁጽሪ ተሌፎንካ ጽሓፍ።';return}
  var ex=ownerOf(ph,''),p=ex;
  if(!p){p={id:uid(),n:RNM.trim(),ph:[ph],kids:[]};S.fam[p.id]=p}else if(RNM.trim()&&!p.n)p.n=RNM.trim();
  k.forEach(function(n){if(!p.kids.some(function(x){return x.n.toLowerCase()===n.toLowerCase()&&gk(x)===g}))p.kids.push({id:uid(),n:n,g:g})});
  REG=[''];RPH='';RNM='';REGMODE=false;try{history.replaceState(null,'',location.pathname)}catch(e2){}setMe(ph);VIEW='p';wfam(p.id);
}

/* ---------- Förälder ---------- */
function parent(){
  var me=pOf(ME),td=iso(new Date()),set={};
  me.kids.forEach(function(k){mdays(gk(k),0).forEach(function(d){set[d]=1})});
  var ds=Object.keys(set).sort().filter(function(d){return d>=td}).slice(0,80);
  if(!ds.length)return'<div class="emp"><b>'+B('Inga datum än','ዕለታት ገና የለን')+'</b></div>';
  if(!PD||ds.indexOf(PD)<0)PD=ds[0];

  return'<div class="pan"><h3>Namn på platsen</h3><input type="text" value="'+esc(c.name)+'" onchange="S.cfg.name=this.value.trim()||\'Närvaro Falun\';wcfg()" style="margin-top:8px"></div>'+
  '<div class="pan"><h3>Standard (barn utan grupp)</h3><div class="sub">Veckodagar, datum och WhatsApp för barn som inte tillhör någon grupp. Nya grupper börjar med samma värden.</div><div class="row">'+dchips(c,'','togGD')+'</div>'+
  '<div class="add"><div style="flex:1"><div class="sub">Första datum</div><input type="date" value="'+esc(c.start)+'" data-g="" onchange="S.cfg.start=this.value;wcfg()"></div><div style="flex:1"><div class="sub">Sista datum</div><input type="date" value="'+esc(c.end)+'" data-g="" onchange="S.cfg.end=this.value;wcfg()"></div></div>'+
  '<div class="sub" style="margin-top:10px">WhatsApp-nummer</div><input type="tel" value="'+esc(c.wa)+'" placeholder="07..." onchange="S.cfg.wa=this.value.trim();wcfg()"></div>'+
  '<div class="pan"><h3>Lösenord för admin</h3><input type="text" value="'+esc(c.pw||ADMIN_PW)+'" onchange="S.cfg.pw=this.value.trim();wcfg()" style="margin-top:8px"></div>'+
  '<div class="pan"><h3>Export och import</h3><div class="sub">Spara all data (eller en grupp) som en JSON-fil, eller läs in en fil.</div><div class="add"><select id="eg"><option value="*">Allt</option>'+c.groups.map(function(g){return'<option value="'+g.id+'">'+esc(g.n)+'</option>'}).join('')+'</select><button class="btn" onclick="expo()">Exportera</button></div>'+
  '<div class="add"><input type="file" id="imf" accept=".json,application/json" onchange="impF(this)"></div><div class="sub" id="im" style="margin-top:6px"></div></div>'+
  '<div class="pan"><h3>Återställ allt</h3><div class="sub">Tar bort alla grupper, föräldrar, barn och närvaro.</div><div class="add"><button class="btn g" style="color:var(--rd)" onclick="resetAll()">Återställ allt</button></div></div>';
}
function expo(){
  var g=$('eg').value,o;
  if(g==='*')o={v:2,cfg:S.cfg,fam:S.fam,abs:S.abs};
  else{var ids={},fam={},abs={};kidsOf(g).forEach(function(x){ids[x.k.id]=1});
    Object.keys(S.fam).forEach(function(i){var p=S.fam[i],ks=p.kids.filter(function(k){return ids[k.id]});if(ks.length)fam[i]=Object.assign({},p,{kids:ks})});
    Object.keys(S.abs).forEach(function(i){if(ids[S.abs[i].kid])abs[i]=S.abs[i]});o={v:2,groups:[gget(g)],fam:fam,abs:abs}}
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));a.download='narvaro-'+(g==='*'?'allt':gnm(g))+'-'+iso(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();
}
function impF(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{
  var o=JSON.parse(r.result);if(o.cfg)S.cfg=Object.assign(clone(DEFCFG),o.cfg);
  (o.groups||[]).forEach(function(g){if(g&&!gget(g.id))S.cfg.groups.push(g)});
  Object.keys(o.fam||{}).forEach(function(i){S.fam[i]=o.fam[i];if(CLOUD)fs.collection('hm_ppl').doc(i).set(o.fam[i])});
  Object.keys(o.abs||{}).forEach(function(i){S.abs[i]=o.abs[i];if(CLOUD)fs.collection('hm_abs').doc(i).set(o.abs[i])});
  wcfg();$('im').textContent='Importerat ✓'}catch(e){$('im').textContent='Filen kunde inte läsas.'}};r.readAsText(f)}
function resetAll(){ask('Ta bort ALL data? Det går inte att ångra.',function(){
  Object.keys(S.fam).forEach(function(i){if(CLOUD)fs.collection('hm_ppl').doc(i).delete()});Object.keys(S.abs).forEach(function(i){if(CLOUD)fs.collection('hm_abs').doc(i).delete()});
  S.fam={};S.abs={};S.cfg=clone(DEFCFG);wcfg()})}
draw();
</script>
</body>
